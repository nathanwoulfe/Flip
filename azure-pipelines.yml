name: $(TeamProject)_$(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - v*/dev
  tags:
    include:
      - release-*

parameters:
  - name: cache_npm
    displayName: Cache NPM packages
    type: boolean
    default: false
  - name: cache_nuget
    displayName: Cache NuGet packages
    type: boolean
    default: false
  - name: release
    displayName: Release
    type: string
    default: auto
    values:
      - auto # Only release to NuGet on public releases, otherwise skip
      - public # Release to NuGet, regardless of release type
      - skip # Skip releasing to NuGet, regardless of release type

variables:
  nodeVersion: 22.x
  solution: Flip.sln
  testProject: tests/Flip.Tests.UnitTests/Flip.Tests.UnitTests.csproj
  buildConfiguration: Release
  DOTNET_NOLOGO: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

stages: 
  - stage: Build
    variables:
      NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
      npm_config_cache: $(Pipeline.Workspace)/.npm_client
    jobs:
      - job: Build
        pool: 
          vmImage: ubuntu-latest
        steps:
          # Checkout source (avoid shallow clone to calculate version height)
          - checkout: self
            fetchDepth: 0

          # Setup build environment
          - task: NuGetAuthenticate@1
            displayName: Authenticate NuGet

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - task: UseDotNet@2
            displayName: Use .NET SDK from global.json
            inputs:
              useGlobalJson: true         

          # Cache and restore NPM packages
          - task: Cache@2
            condition: ${{ parameters.cache_npm }}
            displayName: Cache NPM packages
            inputs:
              key: 'npm | "$(Agent.OS)" | **/package-lock.json, !**/node_modules/**'
              restoreKeys: |
                npm | "$(Agent.OS)"
                npm
              path: $(npm_config_cache)

          # Cache and restore NuGet packages
          - task: Cache@2
            condition: ${{ parameters.cache_nuget }}
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/packages.lock.json, !**/bin/**, !**/obj/**'
              restoreKeys: |
                nuget | "$(Agent.OS)"
                nuget
              path: $(NUGET_PACKAGES)

          - script: npm ci
            displayName: Install NPM packages
            workingDirectory: src/Flip/Client

          - script: npm run build
            displayName: Build client assets
            workingDirectory: src/Flip/Client

          - script: dotnet restore $(solution) --locked-mode
            displayName: Restore NuGet packages

          - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore -p:ContinuousIntegrationBuild=true
            displayName: Run dotnet build
            name: build

          - script: dotnet pack $(solution) --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/nupkg
            displayName: Run dotnet pack

          - task: PublishPipelineArtifact@1
            displayName: Publish Nuget packages
            inputs:
              artifactName: nupkg
              targetPath: $(Build.ArtifactStagingDirectory)/nupkg

  - stage: UnitTests
    displayName: Unit Tests
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: Run Unit Tests
        pool:
          vmImage: ubuntu-latest
        steps:
          # Checkout source (avoid shallow clone to calculate version height)
          - checkout: self
            fetchDepth: 0

          # Setup test environment
          - task: NuGetAuthenticate@1
            displayName: Authenticate NuGet

          - task: UseDotNet@2
            displayName: Use .NET SDK from global.json
            inputs:
              useGlobalJson: true

          - script: dotnet restore $(testProject) --locked-mode
            displayName: Restore NuGet packages

          # Test
          - script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-restore --logger trx --results-directory $(Agent.TempDirectory)/tests
            displayName: Run dotnet test

          # Publish
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '*.trx'
              searchFolder: $(Agent.TempDirectory)/tests
              testRunTitle: Unit Tests - $(Agent.OS)
              configuration: $(buildConfiguration)

  # Azure validates the service connections referenced by step inputs at queue time, even for
  # stages a runtime condition would skip, so an explicit 'skip' is gated at compile time.
  # 'auto' can't be: it depends on NBGV_PublicRelease, which is only known at run time.
  - ${{ if ne(parameters.release, 'skip') }}:
    - stage: Release
      displayName: Release to NuGet
      dependsOn:
        - Build
        - UnitTests
      # Runs when Build and UnitTests succeeded, and either release was explicitly overridden
      # (public) or this is a public release
      condition: |
        and(
          succeeded(),
          or(
            ne('${{ parameters.release }}', 'auto'),
            eq(dependencies.Build.outputs['Build.build.NBGV_PublicRelease'], true)
          )
        )
      jobs:
        - job: WaitForApproval
          displayName: Wait for manual approval
          pool: server
          timeoutInMinutes: 4320 # 3 days
          steps:
            - task: ManualValidation@0
              displayName: Manual approval to publish the release
              inputs:
                notifyUsers: ''
                instructions: 'Approve to publish $(Build.BuildNumber) to NuGet.'
                onTimeout: 'reject'

        - job: NuGet
          displayName: Publish to NuGet
          dependsOn: WaitForApproval
          pool:
            vmImage: windows-latest # NuGetCommand@2 requires Mono and is no longer supported on Ubuntu 24.04+
          steps:
            - checkout: none

            - download: current
              artifact: nupkg
              displayName: Download nupkg artifact

            - task: NuGetCommand@2
              displayName: Publish to NuGet
              inputs:
                command: push
                packagesToPush: $(Pipeline.Workspace)/nupkg/*.nupkg
                nuGetFeedType: external
                publishFeedCredentials: NuGet.org
